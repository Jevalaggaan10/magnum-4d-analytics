name: prediction tracker

# Checks daily after Malaysian draw hours (including Tuesday special draws),
# verifies any pending prediction against the real result, then logs the
# next-draw prediction. Also triggerable manually.
on:
  schedule:
    # 13:15 UTC = 21:15 MYT (results publish ~20:45-21:05 MYT)
    - cron: "15 13 * * *"
    # 08:00 UTC = 16:00 MYT, before the 18:00 publication deadline.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core deps (heavy ML extras intentionally excluded)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tracker.txt

      - name: Check regressions
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run tracker (sync latest result, verify, log next prediction)
        id: tracker
        continue-on-error: true
        run: python scripts/track_predictions.py

      - name: Commit log + state (only when changed)
        run: |
          git config user.name "prediction-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add PREDICTION_LOG.md predictions.json
          if [ -d probability_artifacts ]; then git add probability_artifacts; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(prediction): verify latest draw + log next prediction [skip ci]"
            git push
          fi

      - name: Confirm publication after successful push
        if: steps.tracker.outcome == 'success'
        env:
          PUBLICATION_EVIDENCE: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/track_predictions.py --confirm-publication --publication-evidence "$PUBLICATION_EVIDENCE"
          git add PREDICTION_LOG.md predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(prediction): record publication completion [skip ci]"
            git push
          fi

      - name: Report blocked generation or tracker failure
        if: steps.tracker.outcome == 'failure'
        run: |
          echo "Tracker failed or frozen generation was blocked. Audit updates were retained; publication was not confirmed."
          exit 1
