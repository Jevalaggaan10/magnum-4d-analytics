name: prediction tracker

# Checks daily after Malaysian draw hours (including Tuesday special draws),
# verifies any pending prediction against the real result, then logs the
# next-draw prediction. Also triggerable manually.
on:
  schedule:
    # 13:15 UTC = 21:15 MYT (results publish ~20:45-21:05 MYT)
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core deps (heavy ML extras intentionally excluded)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tracker.txt

      - name: Check regressions
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run tracker (sync latest result, verify, log next prediction)
        run: python scripts/track_predictions.py

      - name: Commit log + state (only when changed)
        run: |
          git config user.name "prediction-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add PREDICTION_LOG.md predictions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(prediction): verify latest draw + log next prediction [skip ci]"
            git push
          fi
